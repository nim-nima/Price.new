
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Price Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f0f0f0;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 6px;
    }
    #search-section {
      margin-top: 40px;
      text-align: center;
    }
    #price-result {
      font-size: 18px;
      color: green;
      margin-top: 10px;
    }
    button {
      padding: 10px 20px;
      margin-top: 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Price Entry & Finder</h1>

  <table id="price-table">
    <thead>
      <tr>
        <th>Code</th>
        <th>Price (تومان)</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <tr>
        <td><input type="text" placeholder="مثلاً PP001" /></td>
        <td><input type="number" placeholder="مثلاً 45000" /></td>
      </tr>
    </tbody>
  </table>
  <button onclick="addRow()">اضافه کردن ردیف</button>
  <button onclick="saveData()">ذخیره اطلاعات</button>

  <div id="search-section">
    <h2>جستجوی قیمت</h2>
    <input type="text" id="search-code" placeholder="کد را وارد کنید" />
    <button onclick="findPrice()">جستجو</button>
    <div id="price-result"></div>
  </div>

  <script>
    function addRow() {
      const tableBody = document.getElementById("table-body");
      const newRow = document.createElement("tr");
      newRow.innerHTML = `
        <td><input type="text" placeholder="مثلاً PP002" /></td>
        <td><input type="number" placeholder="مثلاً 30000" /></td>
      `;
      tableBody.appendChild(newRow);
    }

    function saveData() {
      const rows = document.querySelectorAll("#table-body tr");
      const data = {};
      rows.forEach(row => {
        const code = row.children[0].querySelector("input").value.trim().toUpperCase();
        const price = row.children[1].querySelector("input").value.trim();
        if (code && price) {
          data[code] = price;
        }
      });
      localStorage.setItem("priceData", JSON.stringify(data));
      alert("اطلاعات ذخیره شد");
    }

    function findPrice() {
      const code = document.getElementById("search-code").value.trim().toUpperCase();
      const data = JSON.parse(localStorage.getItem("priceData") || "{}");
      const price = data[code];
      const result = document.getElementById("price-result");
      if (price !== undefined) {
        result.innerText = "قیمت: " + price + " تومان";
      } else {
        result.innerText = "کدی یافت نشد.";
      }
    }
  </script>
</body>
</html>
